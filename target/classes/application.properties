# CONFIGURATION FOR MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURATION FOR JPA/HIBERNATE
# Flyway manages schema, so disable DDL auto
spring.jpa.hibernate.ddl-auto=none
# Show SQL commands in console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CONFIGURATION FOR FLYWAY MIGRATION
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# SERVER PORT CONFIG
server.port=8080